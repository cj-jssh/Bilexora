name: Flutter CI/CD

on:
  push:
    tags:
      # 语义化版本 tag (v1.2.3), 供直接 push tag 触发构建时使用
      - "v*"
  # 手动触发 = 发布入口: 构建产物后读取 pubspec.yaml 的 version,
  # 用 gh release create 自动创建 v{version} 的 tag 并发布 Release。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libsqlite3-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter test
        run: flutter test


  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libsqlite3-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze lib test --no-fatal-infos --fatal-warnings


  flutter-build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libsqlite3-dev

      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------
      # Gradle configuration
      # ------------------------------------------------------------

      - name: Configure Gradle
        shell: bash
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          kotlin.incremental=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------
      # Bergamot native binary
      #
      # IMPORTANT:
      # Do NOT use actions/cache here.
      #
      # GitHub Actions cache is scoped by ref, so different tags
      # cannot reliably reuse the .so.
      #
      # Instead, the binary is stored as a GitHub Release asset.
      # ------------------------------------------------------------

      - name: Calculate Bergamot fingerprint
        id: bm
        shell: bash
        run: |
          set -e

          PAYLOAD="96c0fcca c4c87de6 b56fa78a"

          MD5=$(printf '%s' "$PAYLOAD" | md5sum | cut -d' ' -f1)

          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

          echo "Bergamot fingerprint: $MD5"

      - name: Prepare Bergamot directories
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p /tmp/bergamot

      - name: Download reusable Bergamot binary
        id: bergamot-download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BERGAMOT_MD5: ${{ steps.bm.outputs.md5 }}
        run: |
          set -e

          ASSET="bergamot-${BERGAMOT_MD5}-arm64.tar.gz"

          echo "Looking for release asset: $ASSET"

          if gh release list --limit 100 --json tagName,isDraft,isPrerelease \
              | jq -e '.[] | select(.tagName == "bergamot-binaries")' >/dev/null 2>&1; then
            echo "Found dedicated Bergamot release."
          fi

          if gh release view bergamot-binaries >/dev/null 2>&1; then
            echo "Checking asset..."

            if gh release download bergamot-binaries \
                --pattern "$ASSET" \
                --dir /tmp/bergamot \
                --clobber; then

              echo "Bergamot binary downloaded."

              tar -xzf "/tmp/bergamot/$ASSET" \
                -C android/app/src/main/jniLibs/arm64-v8a

              if [ -f "android/app/src/main/jniLibs/arm64-v8a/libbergamot_translator.so" ]; then
                echo "hit=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          echo "Bergamot binary not found."
          echo "hit=false" >> "$GITHUB_OUTPUT"

      - name: Check Bergamot binary
        shell: bash
        run: |
          if [ -f android/app/src/main/jniLibs/arm64-v8a/libbergamot_translator.so ]; then
            echo "=============================================="
            echo "Bergamot .so: HIT"
            echo "No native compilation required."
            echo "=============================================="
          else
            echo "=============================================="
            echo "Bergamot .so: MISS"
            echo "Native compilation will be required."
            echo "=============================================="
          fi

      # ------------------------------------------------------------
      # If reusable binary exists:
      # prevent bergamot plugin from rebuilding native library.
      # ------------------------------------------------------------

      - name: Disable Bergamot native build
        if: steps.bergamot-download.outputs.hit == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(".flutter-plugins-dependencies")

          if not path.exists():
              print(".flutter-plugins-dependencies not found")
              raise SystemExit(0)

          data = json.loads(path.read_text())

          changed = False

          plugins = data.get("plugins", {})

          for platform in ("android",):
              for plugin in plugins.get(platform, []):
                  if plugin.get("name") == "bergamot_translator":
                      plugin["native_build"] = False
                      changed = True

          if changed:
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2)
              )
              print("Bergamot native_build=false")
          else:
              print("Bergamot plugin entry not found")
          PY

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build APK
        shell: bash
        run: |
          set -e

          time flutter build apk \
            --release \
            --target-platform android-arm64 \
            --no-pub \
            --verbose

      # ------------------------------------------------------------
      # If the .so did not exist before build, extract it and
      # upload it later as a reusable Release asset.
      # ------------------------------------------------------------

      - name: Locate Bergamot native library
        if: steps.bergamot-download.outputs.hit != 'true'
        id: locate-bergamot
        shell: bash
        run: |
          set -e

          echo "Searching for libbergamot_translator.so..."

          FOUND=$(find . \
            -type f \
            -name "libbergamot_translator.so" \
            -not -path "./android/app/src/main/jniLibs/*" \
            | head -n 1 || true)

          if [ -z "$FOUND" ]; then
            echo "ERROR: libbergamot_translator.so was not found."
            exit 1
          fi

          echo "Found:"
          echo "$FOUND"

          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          cp "$FOUND" \
            android/app/src/main/jniLibs/arm64-v8a/libbergamot_translator.so

          echo "path=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Verify Bergamot binary
        shell: bash
        run: |
          set -e

          SO="android/app/src/main/jniLibs/arm64-v8a/libbergamot_translator.so"

          if [ ! -f "$SO" ]; then
            echo "ERROR: $SO does not exist."
            exit 1
          fi

          echo "Bergamot binary:"
          ls -lh "$SO"

          file "$SO"

      # ------------------------------------------------------------
      # Package reusable native binary
      # ------------------------------------------------------------

      - name: Package Bergamot binary
        if: steps.bergamot-download.outputs.hit != 'true'
        shell: bash
        env:
          BERGAMOT_MD5: ${{ steps.bm.outputs.md5 }}
        run: |
          set -e

          cd android/app/src/main/jniLibs/arm64-v8a

          tar -czf \
            "/tmp/bergamot-${BERGAMOT_MD5}-arm64.tar.gz" \
            libbergamot_translator.so

          echo "Created:"
          ls -lh "/tmp/bergamot-${BERGAMOT_MD5}-arm64.tar.gz"

      # ------------------------------------------------------------
      # Save APK for release job
      # ------------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # Upload new Bergamot binary as normal CI artifact.
      #
      # The release job will publish it to the dedicated
      # "bergamot-binaries" release.
      # ------------------------------------------------------------

      - name: Upload Bergamot artifact
        if: steps.bergamot-download.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bergamot-binary
          path: /tmp/bergamot-${{ steps.bm.outputs.md5 }}-arm64.tar.gz
          if-no-files-found: error


  # ==============================================================
  # iOS
  # ==============================================================

  flutter-build-ios:
    name: Build iOS (unsigned IPA)
    runs-on: macos-latest

    # CMake 4.x 已不再兼容第三方的 cmake_minimum_required(<3.5)
    # (vendored marian-dev / ssplit-cpp 仍写 3.5.1)。
    # env.CMAKE_POLICY_VERSION_MINIMUM 会被 xcodebuild 内的所有 cmake
    # configure 继承 (podspec 脚本、pcre2 ExternalProject)。
    # 但 ExternalProject 的命令行参数会覆盖环境变量, 所以下面还在
    # FindPCRE2.cmake 里显式加了 -DCMAKE_POLICY_VERSION_MINIMUM=3.5。
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      EXPANDED_CODE_SIGN_IDENTITY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # 缓存 CocoaPods spec 仓库, 避免每次 pod install 都重新拉取 CDN,
      # 只缓存纯下载内容, 不含原生编译产物, 无正确性风险。
      - name: Cache CocoaPods specs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
          key: cocoapods-specs-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-specs-

      - name: Install native dependencies
        run: |
          brew install cmake ninja
          cmake --version

      # ------------------------------------------------------------
      # 第三方依赖补丁 (原先 iOS job 里做过、后又被删掉的那部分)
      #
      # 每个补丁都带 grep 后置校验, 避免上游变更后静默失效。
      # ------------------------------------------------------------

      - name: Patch vendored dependencies
        shell: bash
        run: |
          set -euo pipefail

          R="plugins/bergamot_translator/third_party/bergamot-translator"

          # (1) Marian: 冷克隆的 submodule 没有 .git/logs/HEAD,
          #     而 marian CMake 的 add_custom_command 把 ${MARIAN_GIT_DIR}/logs/HEAD
          #     当成 DEPENDS, 于是 Unix Makefiles 报
          #     “No rule to make target .../logs/HEAD”。
          #     直接把 DEPENDS 行去掉, marian_version 仍会生成 git_revision.h。
          M="$R/3rd_party/marian-dev/src/CMakeLists.txt"
          if grep -q 'DEPENDS ${MARIAN_GIT_DIR}/logs/HEAD' "$M"; then
            sed -i '' '/DEPENDS ${MARIAN_GIT_DIR}\/logs\/HEAD/d' "$M"
          fi
          ! grep -q 'DEPENDS ${MARIAN_GIT_DIR}/logs/HEAD' "$M"

          # (2) sentencepiece: 新 Clang 拒绝把 static_cast 放进 constexpr 初始化。
          SP="$R/3rd_party/marian-dev/src/3rd_party/sentencepiece/src/trainer_interface.cc"
          sed -i '' 's/constexpr unicode_script::ScriptType kAnyType =/const unicode_script::ScriptType kAnyType =/' "$SP"
          grep -q 'const unicode_script::ScriptType kAnyType =' "$SP"

          # (3) zlib (marian-dev 内置 copy): 它把 OS_CODE 写死在 `MACOS || TARGET_OS_MAC`
          #     分支里, 而现代 Apple SDK 会通过系统头暴露 TARGET_OS_MAC, 于是
          #     走进为 Classic Mac OS 准备的旧路径, 把 fdopen 定义成 NULL。
          #     再往下 zutil.c 会 #include <stdio.h>, 而 _stdio.h 里有
          #         FILE *fdopen(int, const char *);
          #     被宏替换成 `FILE *NULL(int, const char *);` ->
          #         error: expected identifier or '('
          #     修法: 旧路径仅在非 Apple 平台生效(Apple 由下面的 __APPLE__ -> OS_CODE 19
          #     分支处理), 同时避免 OS_CODE 被重复定义。
          ZU="$R/3rd_party/marian-dev/src/3rd_party/zlib/zutil.h"
          sed -i '' 's/^#if defined(MACOS) || defined(TARGET_OS_MAC)$/#if defined(MACOS) \&\& !defined(__APPLE__)/' "$ZU"
          grep -q '^#if defined(MACOS) && !defined(__APPLE__)$' "$ZU"
          ! grep -q 'defined(TARGET_OS_MAC)' "$ZU"

          # (4) zstr/strict_fstream.hpp: 其 strerror_r 分支用 `... || __APPLE__) && !_GNU_SOURCE`
          #     判断 XSI 版原型, 但 iOS SDK 里 _GNU_SOURCE 可能被定义, 于是又落回
          #     GNU 版 strerror_r 调用, 与 XSI 原型不匹配。去掉 !_GNU_SOURCE 条件。
          SF="$R/3rd_party/marian-dev/src/3rd_party/zstr/strict_fstream.hpp"
          sed -i '' 's/ || __APPLE__) && ! _GNU_SOURCE$/ || __APPLE__)/' "$SF"
          ! grep -q '__APPLE__) && ! _GNU_SOURCE' "$SF"

          # (5) marian-dev/src/microsoft/quicksand.h 用了 uint8_t 等类型但未包含
          #     <cstdint>(libc++ 下不再间接引入)。
          QS="$R/3rd_party/marian-dev/src/microsoft/quicksand.h"
          if ! grep -q '#include <cstdint>' "$QS"; then
            python3 - "$QS" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          idx = next(
              (i for i, line in enumerate(lines) if line.strip() == '#pragma once'),
              0,
          )
          lines.insert(idx + 1, '#include <cstdint>')
          path.write_text('\n'.join(lines) + '\n')
          print('patched:', path)
          PY
          fi
          grep -q '#include <cstdint>' "$QS"

          # (6) ssplit/PCRE2: iOS 无系统 libpcre2-8, 走内置 pcre2;
          #     内置 pcre2 是 ExternalProject 独立 configure, 必须显式关掉
          #     pcre2grep / JIT, 否则 iOS 交叉编译时 pcre2grep 链接
          #     ___clear_cache (JIT 符号) 失败, 整个 pcre2 目标失败。
          F="$R/3rd_party/ssplit-cpp/cmake/FindPCRE2.cmake"
          python3 - "$F" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # PCRE2 JIT 在 iOS 上不可用, 且 pcre2grep 链接 JIT 符号会失败。
          # 上游只在 em++ (WASM) 时关 JIT, 这里把 iOS 也纳入。
          # 注意: 不要用含有 \\ 转义的锚点字符串 —— run 块的 heredoc 会再吃一层
          # 反斜杠, 导致文本匹配静默失败。这里改用不带反斜杠的 else 分支做锚点。
          old = '  else()\n    set(PCRE2_JIT_OPTION  "-DPCRE2_SUPPORT_JIT=ON")\n'
          new = (
              '  else()\n'
              '    if(IOS)\n'
              '      set(PCRE2_JIT_OPTION  "-DPCRE2_SUPPORT_JIT=OFF")\n'
              '    else()\n'
              '      set(PCRE2_JIT_OPTION  "-DPCRE2_SUPPORT_JIT=ON")\n'
              '    endif()\n'
          )

          if 'if(IOS)' not in text:
              if old not in text:
                  raise SystemExit('FindPCRE2.cmake: JIT else-branch anchor not found')
              text = text.replace(old, new)

          opts = [
              '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',
              '-DPCRE2_BUILD_PCRE2GREP=OFF',
              '-DPCRE2_BUILD_TESTS=OFF',
              '-DPCRE2_SUPPORT_LIBZ=OFF',
              '-DPCRE2_SUPPORT_LIBBZ2=OFF',
          ]

          lines = text.splitlines()
          out, inserted = [], False
          for line in lines:
              if line.strip() == '-DCMAKE_INSTALL_LIBDIR=${CMAKE_INSTALL_LIBDIR}':
                  out.append(line)
                  out.extend(('    ' + o) for o in opts)
                  inserted = True
              else:
                  out.append(line)

          if not inserted:
              raise SystemExit('FindPCRE2.cmake: PCRE2_CONFIGURE_OPTIONS anchor not found')

          path.write_text('\n'.join(out) + '\n')
          print('patched:', path)
          PY
          grep -q 'PCRE2_BUILD_PCRE2GREP=OFF' "$F"
          grep -q 'if(IOS)' "$F"

          echo '=== marian DEPENDS 检查 ==='
          grep -n 'logs/HEAD' "$M" || echo 'no logs/HEAD dependency (ok)'
          echo '=== FindPCRE2 检查 ==='
          grep -n 'PCRE2_BUILD_PCRE2GREP\|OR IOS\|PCRE2_SUPPORT_JIT' "$F" | head

      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------
      # 清理签名配置
      #
      # 不能把 CODE_SIGN_STYLE 改成 Manual: 无 provisioning profile 时
      # xcodebuild 会直接拒绝, 只在 Runner.app 里留下空壳(520B 空 IPA)。
      # 只删 DEVELOPMENT_TEAM / 清空 identity, 然后构建时用
      # CODE_SIGNING_ALLOWED=NO 真正禁用签名。
      # ------------------------------------------------------------

      - name: Disable code signing in project
        shell: bash
        run: |
          set -euo pipefail

          PBX=ios/Runner.xcodeproj/project.pbxproj

          # 注意 pbxproj 里的键是带引号且带条件的:
          #     "CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";
          # 旧写法 's/CODE_SIGN_IDENTITY = ".*/CODE_SIGN_IDENTITY = "";/g' 有两处错误:
          #   1) `.*` 贪婪吐到行尾, 把条件 [sdk=iphoneos*] 和结尾的 `;` 一起吃掉;
          #   2) 替换文本自己又补了一个 `;`, 于是产出 `"CODE_SIGN_IDENTITY" = "";;`,
          #      双分号直接让 project.pbxproj 解析失败 ->
          #      xcodebuild: 「The project 'Runner' is damaged ... parse error」,
          #      连带 pod install 也失败。
          # 这里用精确正则: 保留键名与 [sdk=...] 条件, 只把值置空。
          perl -i -pe 's/("?CODE_SIGN_IDENTITY(?:\[[^\]]*\])?"? *= *)"[^"]*";/${1}"";/g' "$PBX"

          echo '=== 签名相关字段 ==='
          grep -nE 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|CODE_SIGNING_' "$PBX" || true

          # 硬校验: 不能残留 DEVELOPMENT_TEAM, 也不能出现会让解析器报错的 `;;`
          ! grep -q 'DEVELOPMENT_TEAM' "$PBX"
          ! grep -q ';;' "$PBX"

          # pbxproj 必须仍是合法 plist (提前于 xcodebuild 发现损坏)
          plutil -lint "$PBX"

      # ------------------------------------------------------------
      # 生成原生工程 (pod install)
      #
      # flutter build ios 在没有 DEVELOPMENT_TEAM 时会被 validator 硬编码拒绝
      # (flutter_tools: mac.dart _missingDevelopmentTeam),
      # 所以只用 --config-only 生成工程 + Runner.xcworkspace,
      # 真正的编译交给下面的 xcodebuild。
      # ------------------------------------------------------------

      - name: Flutter iOS config (pod install)
        shell: bash
        run: |
          set -uo pipefail

          # --config-only 只生成原生工程 + 跑 pod install, 不做真正的编译。
          # 这里不因它的退出码直接失败, 而是用产物存在性做硬校验。
          set +e
          flutter build ios --release --config-only --no-codesign 2>&1 | tee /tmp/ios_config.log
          CFG=${PIPESTATUS[0]}
          set -e
          echo "=== flutter config-only exit code: $CFG ==="

          test -f ios/Runner.xcworkspace/contents.xcworkspacedata \
            || { echo 'ERROR: Runner.xcworkspace 未生成'; exit 1; }
          test -f ios/Pods/Manifest.lock \
            || { echo 'ERROR: pod install 未完成 (无 ios/Pods/Manifest.lock)'; exit 1; }
          test -f ios/Flutter/Generated.xcconfig \
            || { echo 'ERROR: ios/Flutter/Generated.xcconfig 未生成'; exit 1; }

          echo '--- ios/Flutter/Generated.xcconfig ---'
          cat ios/Flutter/Generated.xcconfig

      # ------------------------------------------------------------
      # 未签名构建
      #
      # 用 `build` 而不是 `archive`: archive 会走 Xcode 的归档/导出校验,
      # 在无签名环境下容易在最后一步失败; 我们只需要完整可安装的
      # Runner.app, 自己组装 Payload 打 IPA 即可。
      # 注意: xcodebuild 的退出码必须真正冒泡上来 (以前用 `|| true`
      # 把失败吞掉, 于是 mkdir 出来的空 Runner.app 被 zip 成 520B 空 IPA)。
      # ------------------------------------------------------------

      - name: Build iOS (unsigned)
        shell: bash
        run: |
          set -uo pipefail

          cd ios

          run_xcodebuild() {
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$PWD/build/ios_dd" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              "$@" \
              build 2>&1 | tee /tmp/xcodebuild.log
          }

          set +e
          # 首选显式 destination (Xcode 26 推荐写法)
          run_xcodebuild -destination 'generic/platform=iOS'
          XC=${PIPESTATUS[0]}

          if [ "$XC" -ne 0 ] && grep -q "Unable to find a destination" /tmp/xcodebuild.log; then
            echo '--- destination 不被识别, 回退到不带 -destination ---'
            run_xcodebuild
            XC=${PIPESTATUS[0]}
          fi
          set -e

          echo "=== xcodebuild exit code: $XC ==="
          grep -nE 'error:|BUILD FAILED|Undefined symbols|make.*Error' /tmp/xcodebuild.log | tail -40 || true

          if [ "$XC" -ne 0 ]; then
            echo 'ERROR: xcodebuild 失败, 请看上面的 error 行'
            exit "$XC"
          fi

          APP="$PWD/build/ios_dd/Build/Products/Release-iphoneos/Runner.app"
          echo "=== Runner.app: $APP ==="
          du -sh "$APP"
          ls -la "$APP/Frameworks" | head -20

      # ------------------------------------------------------------
      # 打包 + 校验
      #
      # 关键: 校验主二进制存在且是 arm64 Mach-O。
      # 之前 CI 只做了 mkdir Runner.app, 构建失败也照样 zip,
      # 所以“成功”却产出 520B 空 IPA —— 这里必须硬失败。
      # ------------------------------------------------------------

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="ios/build/ios_dd/Build/Products/Release-iphoneos/Runner.app"

          test -d "$APP"
          test -f "$APP/Runner"
          test -f "$APP/Frameworks/App.framework/App"
          test -f "$APP/Frameworks/Flutter.framework/Flutter"

          echo "=== Runner.app size: $(du -sh "$APP" | cut -f1) ==="
          file "$APP/Runner"

          rm -rf ios/Payload
          mkdir -p ios/Payload
          cp -R "$APP" ios/Payload/Runner.app

          # 未签名 IPA: 用 ad-hoc(-) 重签内部 framework,
          # 方便后续用 AltStore / Sideloadly 之类工具自签安装。
          find ios/Payload/Runner.app/Frameworks -type d -name '*.framework' \
            -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true

          cd ios
          rm -f Bilexora_ios_unsigned.ipa
          zip -qry Bilexora_ios_unsigned.ipa Payload

          # IPA 体积硬校验: 完整 App.framework + Flutter.framework 不可能只有几 KB。
          SIZE=$(stat -f%z Bilexora_ios_unsigned.ipa)
          echo "IPA size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1048576 ]; then
            echo 'ERROR: IPA 过小, 疑似空壳/构建失败产物'
            exit 1
          fi
          unzip -l Bilexora_ios_unsigned.ipa | tail -5

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ios/Bilexora_ios_unsigned.ipa
          if-no-files-found: error


  # ==============================================================
  # Release
  # ==============================================================

  release:
    name: Create Release
    # tag 一律取自 pubspec.yaml 的 version:
    #   - push v{version} tag 直达: GITHUB_REF_NAME 即该 tag
    #   - workflow_dispatch 手动发布: 靠本 job 用 gh release create 自动建 tag+Release
    needs:
      - flutter-test
      - flutter-analyze
      - flutter-build-android
      - flutter-build-ios
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag from pubspec.yaml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # 手动触发时以 pubspec version 为准;
          # push tag 触发时直接沿用触发它的 tag (保证 tag 名与产物名一致)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V=$(sed -nE 's/^version:[[:space:]]+([^[:space:]]+).*/\1/p' pubspec.yaml | head -n1)
            [ -n "$V" ] || { echo "ERROR: 无法读取 pubspec.yaml version"; exit 1; }
            TAG="v${V%%+*}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download Android APK
        # Android job 被 if: false 关闭时该 artifact 不存在, 跳过
        if: needs.flutter-build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ios-release

      - name: Download Bergamot artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bergamot-binary
          path: bergamot

      # ------------------------------------------------------------
      # Publish reusable Bergamot binary.
      #
      # This is a dedicated GitHub Release named:
      #     bergamot-binaries
      #
      # It is NOT tied to the application version tag.
      # Therefore every future tag can download the same .so.
      # ------------------------------------------------------------

      - name: Publish Bergamot binary
        if: hashFiles('bergamot/*.tar.gz') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          FILE=$(find bergamot \
            -maxdepth 1 \
            -type f \
            -name "*.tar.gz" \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No Bergamot binary found."
            exit 0
          fi

          echo "Publishing:"
          echo "$FILE"

          if ! gh release view bergamot-binaries >/dev/null 2>&1; then
            echo "Creating dedicated Bergamot release..."

            gh release create bergamot-binaries \
              --title "Bergamot Native Binaries" \
              --notes "Reusable native binaries for CI builds." \
              --prerelease
          fi

          ASSET_NAME=$(basename "$FILE")

          echo "Uploading asset: $ASSET_NAME"

          gh release upload \
            bergamot-binaries \
            "$FILE" \
            --clobber

      # ------------------------------------------------------------
      # Rename artifacts with the tag
      # ------------------------------------------------------------

      - name: Rename artifacts
        shell: bash
        run: |
          set -e

          TAG="${{ steps.version.outputs.tag }}"

          if [ -f release/app-release.apk ]; then
            mv release/app-release.apk "release/Bilexora_${TAG}.apk"
          else
            echo 'Android APK 不存在(Android job 已关闭), 跳过重命名'
          fi

          mv ios-release/Bilexora_ios_unsigned.ipa "release/Bilexora_ios_${TAG}_unsigned.ipa"
          ls -lh release

      # ------------------------------------------------------------
      # Generate release notes
      # ------------------------------------------------------------

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if [ -f "release/Bilexora_${TAG}.apk" ]; then
            ANDROID_LINE="Android APK:

          - Bilexora_${TAG}.apk"
          else
            ANDROID_LINE="(Android APK 本轮未构建)"
          fi

          cat > release-notes.md <<EOF
          ## ${TAG}

          ${ANDROID_LINE}

          iOS IPA (未签名, 需自行用 AltStore / Sideloadly 等工具自签安装):

          - Bilexora_ios_${TAG}_unsigned.ipa
          EOF

      # ------------------------------------------------------------
      # Create application release
      #
      # 手动触发时 gh release create 会同时创建对应 tag 并指向当前 HEAD,
      # 使 tag 名始终等于 pubspec.yaml 的版本号。push-tag 事件时 tag 已存在,
      # gh release create 直接关联该 tag 发布, 不重复创建。
      # ------------------------------------------------------------

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # 幂等: tag 已存在(来自 push 或手动 job 触发)则直接上传, 否则创建
          files=""
          for f in release/Bilexora_*; do
            [ -f "$f" ] && files="$files $f"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            for f in $files; do
              gh release upload "$TAG" "$f" --clobber
            done
          else
            # 参数按需拼接, 避免无文件时报错
            args=("$TAG" --title "$TAG" --notes-file release-notes.md --target "${GITHUB_SHA}")
            for f in $files; do args+=("$f"); done
            gh release create "${args[@]}"
          fi
