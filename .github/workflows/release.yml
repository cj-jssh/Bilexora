---
name: "release"

# 打 tag（推送到远程触发）。tag 由 tools/release.sh 生成 = commit MD5 前 8 位
on:
  push:
    tags:
      - "*"
  # 支持在 GitHub Actions 界面手动触发构建(排查/复跑更方便)
  workflow_dispatch:

jobs:
  # 测试 + 静态检查（作为构建的前置门槛）
  flutter-test:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
        shell: bash
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Run Flutter tests
        run: flutter test
        shell: bash

  flutter-analyze:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
        shell: bash
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Analyze Flutter project
        run: flutter analyze lib test --no-fatal-infos --fatal-warnings
        shell: bash

  # 构建 Android APK
  flutter-build-android:
    name: "Release for Android"
    needs: [flutter-test, flutter-analyze]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Optimize Gradle memory for CI
        run: |
          # GitHub Actions ubuntu 仅 ~7G 内存, 项目 -Xmx8G 超配会导致 OOM/极慢
          # CI 上临时改用适配值, 不修改源文件(本地开发不变)
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          kotlin.incremental=false
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.daemon=true
          EOF
      # 拆分缓存: gradle 依赖 与 bergamot 原生产物(.cxx) 分开, 各自独立命中。
      # 避免把 5.3GB 的 .cxx 塞进单一超大条目, 降低 cache restore/upload 耗时,
      # 也让不涉及 C++ 的改动不会误触发原生全量重编。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache bergamot native build output (.cxx)
        uses: actions/cache@v4
        with:
          path: plugins/bergamot_translator/android/.cxx
          key: ${{ runner.os }}-bergamot-cxx-${{ hashFiles('plugins/bergamot_translator/src/**', 'plugins/bergamot_translator/android/build.gradle', 'plugins/bergamot_translator/third_party/**') }}
          restore-keys: |
            ${{ runner.os }}-bergamot-cxx-
      - name: Cache Flutter & pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      # Release 只构建 arm64-v8a: 手机(真机)几乎都是 arm64。
      # 砍掉 x86_64 使 bergamot C++ 编译耗时减半(CI 提速的主要来源)。
      # 如需模拟器支持可改回不带 --target-platform 或单独加 x86_64 job。
      - name: Build Flutter for Android (arm64 release)
        run: flutter build apk --release --target-platform android-arm64
        shell: bash
      - name: Upload android APK
        uses: actions/upload-artifact@v4
        with:
          name: android_apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 构建 iOS IPA（无签名）
  flutter-build-ios:
    name: "Release for iOS"
    needs: [flutter-test, flutter-analyze]
    runs-on: "macos-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Install native build tools
        run: brew install cmake ninja
      - name: Patch sentencepiece constexpr for newer Clang
        run: |
          FILE="plugins/bergamot_translator/third_party/bergamot-translator/3rd_party/marian-dev/src/3rd_party/sentencepiece/src/trainer_interface.cc"
          # 新 Clang 对 enum constexpr 初始化报错, 改为 const (不改逻辑)
          sed -i.bak 's/constexpr unicode_script::ScriptType kAnyType =/const unicode_script::ScriptType kAnyType =/' "$FILE"
          grep -n 'kAnyType =' "$FILE" || true
      - name: Disable code signing (project cleanup)
        run: |
          # 不要在无 provisioning profile 环境下把 CODE_SIGN_STYLE 改成 Manual:
          # Manual 会在构建阶段被 xcodebuild 拒绝, 导致 Runner.app 只有壳(空 IPA)。
          # 保持 Automatic, 只删 team / 清空 identity。随后手动 xcodebuild 传
          # CODE_SIGNING_ALLOWED=NO 禁用签名, 且必须走 xcode_backend.sh build phase
          # 以嵌入 App.framework / Flutter.framework / Dart AOT(snapshot)。
          sed -i '' '/DEVELOPMENT_TEAM/d' ios/Runner.xcodeproj/project.pbxproj
          perl -i -pe 's/CODE_SIGN_IDENTITY = ".*/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          perl -i -pe 's/"CODE_SIGN_IDENTITY\[[^\"]*\]" = ".*/\"CODE_SIGN_IDENTITY\" = \"\";/g' ios/Runner.xcodeproj/project.pbxproj
          echo "=== 签名相关字段 ==="
          grep -E "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|CODE_SIGNING_" ios/Runner.xcodeproj/project.pbxproj || true
      # flutter build ios 在无 DEVELOPMENT_TEAM 时会被 validator 硬编码拒绝
      # (“Building a deployable iOS app requires a selected Development Team”,
      #  见 flutter_tools ios/mac.dart _missingDevelopmentTeam, 只要 pbxproj 含
      # DEVELOPMENT_TEAM 或 PROVISIONING_PROFILE 任一键即可跳过)。
      # 故不直接跑 flutter build(会被拒绝), 改为 --config-only 生成工程后
      # 用 xcodebuild 手动构建, 绕过 Flutter 签名诊断, 并让 xcode_backend.sh
      # build phase 嵌入 App.framework / Flutter.framework / Dart AOT。
      - name: Build iOS via xcodebuild (bypass flutter validator)
        run: |
          # 1) 生成原生工程(含 SPM 插件解析 + xcode_backend.sh build phase), 不构建
          flutter build ios --release --config-only --no-codesign 2>&1 | tee /tmp/ios_cfg.log || true
          # 2) 用 xcodebuild 手动构建, 显式禁用签名
          #    确保 xcode_backend.sh 的 build phase 被执行以嵌入 App.framework /
          #    Flutter.framework / flutter_assets。
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcbuild.log
          XC_EXIT=${PIPESTATUS[0]}
          echo "=== xcodebuild 退出码: $XC_EXIT ==="
          grep -iE "error:|failed" /tmp/xcbuild.log | tail -30 || true
          APP="$(find build/ios_dd -name 'Runner.app' -type d 2>/dev/null | head -1)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "❌ Runner.app 未生成"
            exit 1
          fi
          echo "=== Runner.app: $APP ==="
          du -sh "$APP"
          echo "=== Runner.app 内容(校验非空壳) ==="
          ls -la "$APP"
          ls -la "$APP/Frameworks" 2>/dev/null || true
          du -sh "$APP/Frameworks" 2>/dev/null || true
          # 校验是否存在 Dart AOT 内核(杜绝空壳)
          ls -la "$APP/Frameworks/App.framework" 2>/dev/null || echo "⚠️ 无 App.framework(可能空壳)"
          ls "$APP/Frameworks/App.framework" 2>/dev/null || true
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: ""
      - name: Create unsigned IPA
        run: |
          APP="$(find build/ios_dd -name 'Runner.app' -type d 2>/dev/null | head -1)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "❌ Runner.app 不存在"
            exit 1
          fi
          echo "app: $APP (大小: $(du -sh "$APP" | cut -f1))"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/Runner.app
          find Payload/Runner.app/Frameworks -type d -name '*.framework' -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
          zip -q -r Bilexora_ios_${{ github.ref_name }}.ipa Payload
          echo "=== 生成的 IPA ==="
          ls -la Bilexora_ios_*.ipa
          du -sh Bilexora_ios_*.ipa
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios_ipa
          path: Bilexora_ios_*.ipa

  # 汇总产物并发布 GitHub Release
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: [flutter-build-android, flutter-build-ios]
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download android APK
        uses: actions/download-artifact@v4
        with:
          name: android_apk
          path: android_apk

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios_ipa
          path: ios_ipa

      - name: Rename artifacts with tag
        run: |
          cp android_apk/app-release.apk Bilexora_android_${{ github.ref_name }}.apk
          cp ios_ipa/*.ipa Bilexora_ios_${{ github.ref_name }}.ipa

      - name: Prepare release notes
        id: release_notes
        run: |
          FULL_HASH="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --format=%s)

          # 找到上一个 tag 作为基准；找不到则用项目首个 commit
          PREV_TAG=$(git tag --sort=-creatordate | tail -n +2 | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD)"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          # 只保留 feat/fix 开头的提交，按类型分组
          CHANGELOG="$(git log --no-merges --format='%s' $RANGE | grep -Ei '^(feat|fix)(\(|\)|:)' || true)"
          FEATURES="$(echo "$CHANGELOG" | grep -Ei '^feat' || true)"
          FIXES="$(echo "$CHANGELOG" | grep -Ei '^fix' || true)"

          BODY="### 本次发布\n"
          BODY+="- **commit**: \`$FULL_HASH\`\n"
          BODY+="- **短哈希**: \`${FULL_HASH:0:8}\`\n"
          BODY+="- **提交信息**: $COMMIT_MSG\n\n"
          BODY+="---\n"
          BODY+="### 🚀 新功能 (feat)\n\n"
          BODY+="$FEATURES\n\n"
          BODY+="---\n"
          BODY+="### 🐛 修复 (fix)\n\n"
          BODY+="$FIXES\n"

          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          printf '%b' "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Release 标题使用 tag 名（commit MD5 前8位）
          name: Bilexora ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.release_body }}
          files: |
            Bilexora_android_*.apk
            Bilexora_ios_*.ipa