---
name: "release"

# 打 tag（推送到远程触发）。tag 由 tools/release.sh 生成 = commit MD5 前 8 位
on:
  push:
    tags:
      - "*"
  # 支持在 GitHub Actions 界面手动触发构建(排查/复跑更方便)
  workflow_dispatch:

jobs:
  # 测试 + 静态检查（作为构建的前置门槛）
  flutter-test:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
        shell: bash
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Run Flutter tests
        run: flutter test
        shell: bash

  flutter-analyze:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
        shell: bash
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Analyze Flutter project
        run: flutter analyze lib test --no-fatal-infos --fatal-warnings
        shell: bash

  # 构建 Android APK
  flutter-build-android:
    name: "Release for Android"
    needs: [flutter-test, flutter-analyze]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Optimize Gradle memory for CI
        run: |
          # GitHub Actions ubuntu 仅 ~7G 内存, 项目 -Xmx8G 超配会导致 OOM/极慢
          # CI 上临时改用适配值, 不修改源文件(本地开发不变)
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          kotlin.incremental=false
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.daemon=true
          EOF
      # 拆分缓存: gradle 依赖 与 bergamot 原生产物(.cxx) 分开, 各自独立命中。
      # 避免把 5.3GB 的 .cxx 塞进单一超大条目, 降低 cache restore/upload 耗时,
      # 也让不涉及 C++ 的改动不会误触发原生全量重编。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache bergamot native build output (.cxx)
        uses: actions/cache@v4
        with:
          path: plugins/bergamot_translator/android/.cxx
          key: ${{ runner.os }}-bergamot-cxx-${{ hashFiles('plugins/bergamot_translator/src/**', 'plugins/bergamot_translator/android/build.gradle', 'plugins/bergamot_translator/third_party/**') }}
          restore-keys: |
            ${{ runner.os }}-bergamot-cxx-
      - name: Cache Flutter & pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      # Release 只构建 arm64-v8a: 手机(真机)几乎都是 arm64。
      # 砍掉 x86_64 使 bergamot C++ 编译耗时减半(CI 提速的主要来源)。
      # 如需模拟器支持可改回不带 --target-platform 或单独加 x86_64 job。
      - name: Build Flutter for Android (arm64 release)
        run: flutter build apk --release --target-platform android-arm64
        shell: bash
      - name: Upload android APK
        uses: actions/upload-artifact@v4
        with:
          name: android_apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 构建 iOS IPA（无签名）
  flutter-build-ios:
    name: "Release for iOS"
    needs: [flutter-test, flutter-analyze]
    runs-on: "macos-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Install native build tools
        run: brew install cmake ninja
      # 新 Clang 对 enum constexpr 初始化报错, 改为 const (不改逻辑)。
      # vendored marian-dev 需要该 patch 才可通过新 Clang 编译。
      - name: Patch sentencepiece constexpr for newer Clang
        run: |
          FILE="plugins/bergamot_translator/third_party/bergamot-translator/3rd_party/marian-dev/src/3rd_party/sentencepiece/src/trainer_interface.cc"
          sed -i.bak 's/constexpr unicode_script::ScriptType kAnyType =/const unicode_script::ScriptType kAnyType =/' "$FILE"
          grep -n 'kAnyType =' "$FILE" || true
      # CMake 4.x 移除了对 cmake_minimum_required < 3.5 的兼容(vendored
      # marian-dev/ssplit-cpp 仍写 3.5), 会在 configure 时报
      # CMAKE_MINIMUM_REQUIRED 错误。patch podspec 里的 cmake 命令传
      # CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容新 CMake。
      - name: Patch bergamot podspec for CMake 4
        run: |
          PODSPEC="plugins/bergamot_translator/ios/bergamot_translator.podspec"
          sed -i.bak 's@^cmake -S "@CMAKE_POLICY_VERSION_MINIMUM=3.5 cmake -S "@' "$PODSPEC"
          echo "=== cmake 命令 ==="
          grep -n "cmake -S" "$PODSPEC" | head
      # 修复 vendored marian-dev 的 git_revision.h 生成: 其 CMake 的
      # add_custom_command DEPENDS <gitdir>/logs/HEAD, 而 GitHub Actions 冷克隆
      # submodule 不含 logs/HEAD, 导致 make 报 “No rule to make target .../logs/HEAD”。
      - name: Fix marian-dev git logs/HEAD (CI cold submodule)
        run: |
          cd plugins/bergamot_translator/third_party/bergamot-translator
          while IFS= read -r gf; do
            D="$(dirname "$gf")/$(sed 's#^gitdir: ##' "$gf")"
            D="$(cd "$(dirname "$D")" && pwd)/$(basename "$D")"
            if [ -d "$D" ] && [ ! -f "$D/logs/HEAD" ]; then
              mkdir -p "$D/logs"
              echo > "$D/logs/HEAD"
              echo "created $D/logs/HEAD"
            fi
          done < <(find . -name .git -type f)
          MARIAN="$(cat 3rd_party/marian-dev/.git 2>/dev/null | sed 's#^gitdir: ##')"
          echo "marian gitdir: $MARIAN"
      # flutter build ios(any form) 在 pbxproj 同时缺少 DEVELOPMENT_TEAM 与
      # PROVISIONING_PROFILE 时会被 Flutter validator 硬编码拒绝 (“Building a
      # deployable iOS app requires a selected Development Team”)。
      # 注入一个占位 DEVELOPMENT_TEAM 即可让 validator 放行; 配合 --no-codesign 传
      # CODE_SIGNING_ALLOWED=NO, xcodebuild 不会真正签名, 产物保持未签名。
      # 采用标准 flutter build 流程, 由 xcode_backend.sh 完整嵌入 App.framework /
      # Flutter.framework / Dart AOT, 避免空壳。
      - name: Enable unsigned iOS build (placeholder team)
        run: |
          # 注入占位 DEVELOPMENT_TEAM, 规避 Flutter validator 因缺 team 拒绝;
          # 未签名构建(--no-codesign)不会真正签, 占位 team 无副作用。
          awk '/CODE_SIGN_STYLE = Automatic;/{print; print "\t\t\t\tDEVELOPMENT_TEAM = 0000000000;"; next}{print}' ios/Runner.xcodeproj/project.pbxproj > tmp.pbxproj && mv tmp.pbxproj ios/Runner.xcodeproj/project.pbxproj
          echo "=== 签名相关字段 ==="
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|CODE_SIGNING_" ios/Runner.xcodeproj/project.pbxproj || true
      - name: Build iOS release (no codesign, standard flow)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/ios_build.log
          EXIT=${PIPESTATUS[0]}
          echo "=== flutter build 退出码: $EXIT ==="
          grep -iE "error:|failed" /tmp/ios_build.log | tail -30 || true
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "❌ Runner.app 未生成"
            exit 1
          fi
          echo "=== Runner.app: $APP ==="
          du -sh "$APP"
          echo "=== Runner.app 内容(校验非空壳) ==="
          ls -la "$APP"
          ls -la "$APP/Frameworks" 2>/dev/null || true
          du -sh "$APP/Frameworks" 2>/dev/null || true
          ls -la "$APP/Frameworks/App.framework" 2>/dev/null || echo "⚠️ 无 App.framework(可能空壳)"
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"

      - name: Create unsigned IPA
        run: |
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "❌ Runner.app 不存在"
            exit 1
          fi
          echo "app: $APP (大小: $(du -sh "$APP" | cut -f1))"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/Runner.app
          find Payload/Runner.app/Frameworks -type d -name '*.framework' -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
          zip -q -r Bilexora_ios_${{ github.ref_name }}.ipa Payload
          echo "=== 生成的 IPA ==="
          ls -la Bilexora_ios_*.ipa
          du -sh Bilexora_ios_*.ipa
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios_ipa
          path: Bilexora_ios_*.ipa

  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: [flutter-build-android, flutter-build-ios]
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download android APK
        uses: actions/download-artifact@v4
        with:
          name: android_apk
          path: android_apk

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios_ipa
          path: ios_ipa

      - name: Rename artifacts with tag
        run: |
          cp android_apk/app-release.apk Bilexora_android_${{ github.ref_name }}.apk
          cp ios_ipa/*.ipa Bilexora_ios_${{ github.ref_name }}.ipa

      - name: Prepare release notes
        id: release_notes
        run: |
          FULL_HASH="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --format=%s)

          # 找到上一个 tag 作为基准；找不到则用项目首个 commit
          PREV_TAG=$(git tag --sort=-creatordate | tail -n +2 | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD)"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          # 只保留 feat/fix 开头的提交，按类型分组
          CHANGELOG="$(git log --no-merges --format='%s' $RANGE | grep -Ei '^(feat|fix)(\(|\)|:)' || true)"
          FEATURES="$(echo "$CHANGELOG" | grep -Ei '^feat' || true)"
          FIXES="$(echo "$CHANGELOG" | grep -Ei '^fix' || true)"

          BODY="### 本次发布\n"
          BODY+="- **commit**: \`$FULL_HASH\`\n"
          BODY+="- **短哈希**: \`${FULL_HASH:0:8}\`\n"
          BODY+="- **提交信息**: $COMMIT_MSG\n\n"
          BODY+="---\n"
          BODY+="### 🚀 新功能 (feat)\n\n"
          BODY+="$FEATURES\n\n"
          BODY+="---\n"
          BODY+="### 🐛 修复 (fix)\n\n"
          BODY+="$FIXES\n"

          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          printf '%b' "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Release 标题使用 tag 名（commit MD5 前8位）
          name: Bilexora ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.release_body }}
          files: |
            Bilexora_android_*.apk
            Bilexora_ios_*.ipa