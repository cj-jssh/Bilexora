---
name: "release"

# 打 tag（推送到远程触发）。tag 由 tools/release.sh 生成 = commit MD5 前 8 位
on:
  push:
    tags:
      - "*"

jobs:
  # 测试 + 静态检查（作为构建的前置门槛）
  flutter-test:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
        shell: bash
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Run Flutter tests
        run: flutter test
        shell: bash

  flutter-analyze:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
        shell: bash
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --fatal-warnings
        shell: bash

  # 构建 Android APK
  flutter-build-android:
    name: "Release for Android"
    needs: [flutter-test, flutter-analyze]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Build Flutter for Android
        run: flutter build apk --release
        shell: bash
      - name: Upload android APK
        uses: actions/upload-artifact@v4
        with:
          name: android_apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 构建 iOS IPA（无签名）
  flutter-build-ios:
    name: "Release for iOS"
    needs: [flutter-test, flutter-analyze]
    runs-on: "macos-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Install native build tools
        run: brew install cmake ninja
      - name: Build IPA
        run: flutter build ios --release --no-codesign
      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -q -r Bilexora_ios_${{ github.ref_name }}.ipa Payload
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios_ipa
          path: Bilexora_ios_*.ipa

  # 汇总产物并发布 GitHub Release
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: [flutter-build-android, flutter-build-ios]
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Download android APK
        uses: actions/download-artifact@v4
        with:
          name: android_apk
          path: android_apk

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios_ipa
          path: ios_ipa

      - name: Rename artifacts with tag
        run: |
          cp android_apk/app-release.apk Bilexora_android_${{ github.ref_name }}.apk
          cp ios_ipa/*.ipa Bilexora_ios_${{ github.ref_name }}.ipa

      - name: Prepare release notes
        id: release_notes
        run: |
          FULL_HASH="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --format=%s)

          # 找到上一个 tag 作为基准；找不到则用项目首个 commit
          PREV_TAG=$(git tag --sort=-creatordate | tail -n +2 | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD)"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          # 只保留 feat/fix 开头的提交，按类型分组
          CHANGELOG="$(git log --no-merges --format='%s' $RANGE | grep -Ei '^(feat|fix)(\(|\)|:)' || true)"
          FEATURES="$(echo "$CHANGELOG" | grep -Ei '^feat' || true)"
          FIXES="$(echo "$CHANGELOG" | grep -Ei '^fix' || true)"

          BODY="### 本次发布\n"
          BODY+="- **commit**: \`$FULL_HASH\`\n"
          BODY+="- **短哈希**: \`${FULL_HASH:0:8}\`\n"
          BODY+="- **提交信息**: $COMMIT_MSG\n\n"
          BODY+="---\n"
          BODY+="### 🚀 新功能 (feat)\n\n"
          BODY+="$FEATURES\n\n"
          BODY+="---\n"
          BODY+="### 🐛 修复 (fix)\n\n"
          BODY+="$FIXES\n"

          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          printf '%b' "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Release 标题使用 tag 名（commit MD5 前8位）
          name: Bilexora ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.release_body }}
          files: |
            Bilexora_android_*.apk
            Bilexora_ios_*.ipa