---
name: "release"

# 打 tag（推送到远程触发）。tag 由 tools/release.sh 生成 = commit MD5 前 8 位
on:
  push:
    tags:
      - "*"

jobs:
  # 测试 + 静态检查（作为构建的前置门槛）
  flutter-test:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
        shell: bash
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Run Flutter tests
        run: flutter test
        shell: bash

  flutter-analyze:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
        shell: bash
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Analyze Flutter project
        run: flutter analyze lib test --no-fatal-infos --fatal-warnings
        shell: bash

  # 构建 Android APK
  flutter-build-android:
    name: "Release for Android"
    needs: [flutter-test, flutter-analyze]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Optimize Gradle memory for CI
        run: |
          # GitHub Actions ubuntu 仅 ~7G 内存, 项目 -Xmx8G 超配会导致 OOM/极慢
          # CI 上临时改用适配值, 不修改源文件(本地开发不变)
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          kotlin.incremental=false
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.daemon=true
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build Flutter for Android
        run: flutter build apk --release
        shell: bash
      - name: Upload android APK
        uses: actions/upload-artifact@v4
        with:
          name: android_apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 构建 iOS IPA（无签名）
  flutter-build-ios:
    name: "Release for iOS"
    needs: [flutter-test, flutter-analyze]
    runs-on: "macos-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: '3.47.4'
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Install native build tools
        run: brew install cmake ninja
      - name: Patch sentencepiece constexpr for newer Clang
        run: |
          FILE="plugins/bergamot_translator/third_party/bergamot-translator/3rd_party/marian-dev/src/3rd_party/sentencepiece/src/trainer_interface.cc"
          # 新 Clang 对 enum constexpr 初始化报错, 改为 const (不改逻辑)
          sed -i.bak 's/constexpr unicode_script::ScriptType kAnyType =/const unicode_script::ScriptType kAnyType =/' "$FILE"
          grep -n 'kAnyType =' "$FILE" || true
      - name: Disable code signing (project cleanup)
        run: |
          # Flutter 预检(validateXcodeProject)会在 xcodebuild 前读 pbxproj, 发现签名配置
          # 未禁用就误报 “Development Team required”。
          # 参考已验证方案: 删除 team / 清空 id / 显式禁用签名 (不改 Manual)
          sed -i '' '/DEVELOPMENT_TEAM/d' ios/Runner.xcodeproj/project.pbxproj
          perl -i -pe 's/CODE_SIGN_IDENTITY = ".*/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          perl -i -pe 's/"CODE_SIGN_IDENTITY\[[^\"]*\]" = ".*/\"CODE_SIGN_IDENTITY\" = \"\";/g' ios/Runner.xcodeproj/project.pbxproj
          perl -i -pe 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n                            CODE_SIGNING_ALLOWED = NO;\n                            CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          echo "=== 签名相关字段 ==="
          grep -E "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|CODE_SIGNING_" ios/Runner.xcodeproj/project.pbxproj || true
      - name: Build IPA (flutter build + fallback)
        run: |
          # 清理可能的构建产物, 避免 stale 文件干扰
          rm -rf build/ios
          # flutter build 可能因签名误报退出失败, 但 Runner.app 若生成则视为成功
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/ios_build.log
          set -e
          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "=== Runner.app 未生成, 显示真实 error 行 ==="
            grep -iE "error:|failed|\berror\b" /tmp/ios_build.log | tail -30 || true
            echo "=== fallback 到 xcodebuild workspace ==="
            cd ios
            xcodebuild -workspace Runner.xcworkspace -scheme Runner \
              -configuration Release -sdk iphoneos -destination 'generic/platform=ios' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee /tmp/xcbuild.log
            cd ..
            grep -iE "error:|failed" /tmp/xcbuild.log | tail -30 || true
          fi
          ls -la build/ios/iphoneos/Runner.app || echo "Runner.app 不存在"
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: ""
      - name: Create unsigned IPA
        run: |
          ls -la build/ios/iphoneos/ || true
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          # 对无签名的 framework 做一致的 ad-hoc 签名, 避免链接问题
          find Payload/Runner.app/Frameworks -type d -name '*.framework' -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
          zip -q -r Bilexora_ios_${{ github.ref_name }}.ipa Payload
          ls -la Bilexora_ios_*.ipa
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios_ipa
          path: Bilexora_ios_*.ipa

  # 汇总产物并发布 GitHub Release
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: [flutter-build-android, flutter-build-ios]
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download android APK
        uses: actions/download-artifact@v4
        with:
          name: android_apk
          path: android_apk

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios_ipa
          path: ios_ipa

      - name: Rename artifacts with tag
        run: |
          cp android_apk/app-release.apk Bilexora_android_${{ github.ref_name }}.apk
          cp ios_ipa/*.ipa Bilexora_ios_${{ github.ref_name }}.ipa

      - name: Prepare release notes
        id: release_notes
        run: |
          FULL_HASH="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --format=%s)

          # 找到上一个 tag 作为基准；找不到则用项目首个 commit
          PREV_TAG=$(git tag --sort=-creatordate | tail -n +2 | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD)"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          # 只保留 feat/fix 开头的提交，按类型分组
          CHANGELOG="$(git log --no-merges --format='%s' $RANGE | grep -Ei '^(feat|fix)(\(|\)|:)' || true)"
          FEATURES="$(echo "$CHANGELOG" | grep -Ei '^feat' || true)"
          FIXES="$(echo "$CHANGELOG" | grep -Ei '^fix' || true)"

          BODY="### 本次发布\n"
          BODY+="- **commit**: \`$FULL_HASH\`\n"
          BODY+="- **短哈希**: \`${FULL_HASH:0:8}\`\n"
          BODY+="- **提交信息**: $COMMIT_MSG\n\n"
          BODY+="---\n"
          BODY+="### 🚀 新功能 (feat)\n\n"
          BODY+="$FEATURES\n\n"
          BODY+="---\n"
          BODY+="### 🐛 修复 (fix)\n\n"
          BODY+="$FIXES\n"

          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          printf '%b' "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Release 标题使用 tag 名（commit MD5 前8位）
          name: Bilexora ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.release_body }}
          files: |
            Bilexora_android_*.apk
            Bilexora_ios_*.ipa