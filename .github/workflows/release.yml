```yaml
name: Flutter CI/CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libsqlite3-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter test
        run: flutter test


  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libsqlite3-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze


  flutter-build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libsqlite3-dev

      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------
      # Gradle configuration
      # ------------------------------------------------------------

      - name: Configure Gradle
        shell: bash
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          kotlin.incremental=true
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------
      # Bergamot native binary
      #
      # IMPORTANT:
      # Do NOT use actions/cache here.
      #
      # GitHub Actions cache is scoped by ref, so different tags
      # cannot reliably reuse the .so.
      #
      # Instead, the binary is stored as a GitHub Release asset.
      # ------------------------------------------------------------

      - name: Calculate Bergamot fingerprint
        id: bm
        shell: bash
        run: |
          set -e

          PAYLOAD="96c0fcca c4c87de6 b56fa78a"

          MD5=$(printf '%s' "$PAYLOAD" | md5sum | cut -d' ' -f1)

          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

          echo "Bergamot fingerprint: $MD5"

      - name: Prepare Bergamot directories
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p /tmp/bergamot

      - name: Download reusable Bergamot binary
        id: bergamot-download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BERGAMOT_MD5: ${{ steps.bm.outputs.md5 }}
        run: |
          set -e

          ASSET="bergamot-${BERGAMOT_MD5}-arm64.tar.gz"

          echo "Looking for release asset: $ASSET"

          if gh release list --limit 100 --json tagName,isDraft,isPrerelease \
              | jq -e '.[] | select(.tagName == "bergamot-binaries")' >/dev/null 2>&1; then
            echo "Found dedicated Bergamot release."
          fi

          if gh release view bergamot-binaries >/dev/null 2>&1; then
            echo "Checking asset..."

            if gh release download bergamot-binaries \
                --pattern "$ASSET" \
                --dir /tmp/bergamot \
                --clobber; then

              echo "Bergamot binary downloaded."

              tar -xzf "/tmp/bergamot/$ASSET" \
                -C android/app/src/main/jniLibs/arm64-v8a

              if [ -f "android/app/src/main/jniLibs/arm64-v8a/libbergamot_translator.so" ]; then
                echo "hit=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          echo "Bergamot binary not found."
          echo "hit=false" >> "$GITHUB_OUTPUT"

      - name: Check Bergamot binary
        shell: bash
        run: |
          if [ -f android/app/src/main/jniLibs/arm64-v8a/libbergamot_translator.so ]; then
            echo "=============================================="
            echo "Bergamot .so: HIT"
            echo "No native compilation required."
            echo "=============================================="
          else
            echo "=============================================="
            echo "Bergamot .so: MISS"
            echo "Native compilation will be required."
            echo "=============================================="
          fi

      # ------------------------------------------------------------
      # If reusable binary exists:
      # prevent bergamot plugin from rebuilding native library.
      # ------------------------------------------------------------

      - name: Disable Bergamot native build
        if: steps.bergamot-download.outputs.hit == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(".flutter-plugins-dependencies")

          if not path.exists():
              print(".flutter-plugins-dependencies not found")
              raise SystemExit(0)

          data = json.loads(path.read_text())

          changed = False

          plugins = data.get("plugins", {})

          for platform in ("android",):
              for plugin in plugins.get(platform, []):
                  if plugin.get("name") == "bergamot_translator":
                      plugin["native_build"] = False
                      changed = True

          if changed:
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2)
              )
              print("Bergamot native_build=false")
          else:
              print("Bergamot plugin entry not found")
          PY

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build APK
        shell: bash
        run: |
          set -e

          time flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      # ------------------------------------------------------------
      # If the .so did not exist before build, extract it and
      # upload it later as a reusable Release asset.
      # ------------------------------------------------------------

      - name: Locate Bergamot native library
        if: steps.bergamot-download.outputs.hit != 'true'
        id: locate-bergamot
        shell: bash
        run: |
          set -e

          echo "Searching for libbergamot_translator.so..."

          FOUND=$(find . \
            -type f \
            -name "libbergamot_translator.so" \
            -not -path "./android/app/src/main/jniLibs/*" \
            | head -n 1 || true)

          if [ -z "$FOUND" ]; then
            echo "ERROR: libbergamot_translator.so was not found."
            exit 1
          fi

          echo "Found:"
          echo "$FOUND"

          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          cp "$FOUND" \
            android/app/src/main/jniLibs/arm64-v8a/libbergamot_translator.so

          echo "path=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Verify Bergamot binary
        shell: bash
        run: |
          set -e

          SO="android/app/src/main/jniLibs/arm64-v8a/libbergamot_translator.so"

          if [ ! -f "$SO" ]; then
            echo "ERROR: $SO does not exist."
            exit 1
          fi

          echo "Bergamot binary:"
          ls -lh "$SO"

          file "$SO"

      # ------------------------------------------------------------
      # Package reusable native binary
      # ------------------------------------------------------------

      - name: Package Bergamot binary
        if: steps.bergamot-download.outputs.hit != 'true'
        shell: bash
        env:
          BERGAMOT_MD5: ${{ steps.bm.outputs.md5 }}
        run: |
          set -e

          cd android/app/src/main/jniLibs/arm64-v8a

          tar -czf \
            "/tmp/bergamot-${BERGAMOT_MD5}-arm64.tar.gz" \
            libbergamot_translator.so

          echo "Created:"
          ls -lh "/tmp/bergamot-${BERGAMOT_MD5}-arm64.tar.gz"

      # ------------------------------------------------------------
      # Save APK for release job
      # ------------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # Upload new Bergamot binary as normal CI artifact.
      #
      # The release job will publish it to the dedicated
      # "bergamot-binaries" release.
      # ------------------------------------------------------------

      - name: Upload Bergamot artifact
        if: steps.bergamot-download.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bergamot-binary
          path: /tmp/bergamot-${{ steps.bm.outputs.md5 }}-arm64.tar.gz
          if-no-files-found: error


  # ==============================================================
  # iOS
  # ==============================================================

  flutter-build-ios:
    name: Build iOS
    if: ${{ false }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: |
          brew install cmake ninja

      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------
      # Remove DEVELOPMENT_TEAM from project settings
      # ------------------------------------------------------------

      - name: Remove DEVELOPMENT_TEAM
        shell: bash
        run: |
          find ios -type f \
            \( -name "*.pbxproj" -o -name "*.xcconfig" \) \
            -print0 |
          xargs -0 sed -i '' '/DEVELOPMENT_TEAM/d' || true

      # ------------------------------------------------------------
      # Flutter iOS configuration
      # ------------------------------------------------------------

      - name: Flutter iOS config
        run: |
          flutter build ios \
            --release \
            --config-only \
            --no-codesign || true

      # ------------------------------------------------------------
      # Xcode archive without signing
      # ------------------------------------------------------------

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -e

          cd ios

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e

          cd ios

          rm -rf Payload
          mkdir -p Payload

          cp -R \
            build/Runner.xcarchive/Products/Applications/Runner.app \
            Payload/Runner.app

          zip -r unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ios/unsigned.ipa


  # ==============================================================
  # Release
  # ==============================================================

  release:
    name: Create Release
    needs:
      - flutter-test
      - flutter-analyze
      - flutter-build-android
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release

      - name: Download Bergamot artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bergamot-binary
          path: bergamot

      # ------------------------------------------------------------
      # Publish reusable Bergamot binary.
      #
      # This is a dedicated GitHub Release named:
      #     bergamot-binaries
      #
      # It is NOT tied to the application version tag.
      # Therefore every future tag can download the same .so.
      # ------------------------------------------------------------

      - name: Publish Bergamot binary
        if: hashFiles('bergamot/*.tar.gz') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          FILE=$(find bergamot \
            -maxdepth 1 \
            -type f \
            -name "*.tar.gz" \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No Bergamot binary found."
            exit 0
          fi

          echo "Publishing:"
          echo "$FILE"

          if ! gh release view bergamot-binaries >/dev/null 2>&1; then
            echo "Creating dedicated Bergamot release..."

            gh release create bergamot-binaries \
              --title "Bergamot Native Binaries" \
              --notes "Reusable native binaries for CI builds." \
              --prerelease
          fi

          ASSET_NAME=$(basename "$FILE")

          echo "Uploading asset: $ASSET_NAME"

          gh release upload \
            bergamot-binaries \
            "$FILE" \
            --clobber

      # ------------------------------------------------------------
      # Rename APK
      # ------------------------------------------------------------

      - name: Rename APK
        shell: bash
        run: |
          set -e

          mv \
            release/app-release.apk \
            release/app-${GITHUB_REF_NAME}.apk

      # ------------------------------------------------------------
      # Generate release notes
      # ------------------------------------------------------------

      - name: Generate release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## ${GITHUB_REF_NAME}

          Android APK:

          - app-${GITHUB_REF_NAME}.apk
          EOF

      # ------------------------------------------------------------
      # Create application release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release/app-${{ github.ref_name }}.apk
```